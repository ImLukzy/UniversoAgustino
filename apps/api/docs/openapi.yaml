      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [document, bazar] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
