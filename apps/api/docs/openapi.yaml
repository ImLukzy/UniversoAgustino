      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND } }
    patch:
      tags: [bazar]
      summary: Edita el dueño (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '404': { description: NOT_FOUND } }
    delete:
      tags: [bazar]
      summary: Elimina el dueño; 409 si hay pedidos vivos (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND }, '409': { description: CONFLICT_ACTIVE_ORDERS } }
  /bazar/{id}/reserve:
    post:
      tags: [bazar]
      summary: Marca RESERVED (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /orders:
    post:
      tags: [orders]
      summary: Crea pedido PENDING con TTL 30min + snapshot (auth). Alquiler bazar exige rentalStart/End
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemType, itemId]
              properties:
                itemType: { type: string, enum: [document, bazar] }
                itemId: { type: string }
                rentalStart: { type: string, format: date-time }
                rentalEnd: { type: string, format: date-time }
      responses:
        '200': { description: Apunte con pedido vivo del mismo comprador (PENDING/PAID) — se reutiliza, no se duplica }
        '201': { description: Creado (sellerId, expiresAt, itemTitle, itemPriceCents, feeBps) }
        '400': { description: SELF_PURCHASE, FREE_ITEM, DATES_REQUIRED o BAD_DATES }
        '409': { description: NOT_AVAILABLE (con details.availableAt) o ALREADY_OWNED }
  /orders/mine:
    get:
      tags: [orders]
      description: "Incluye refundProofUrl/refundPaymentRef/refundedAt del reembolso propio; comprobante privado comprador/equipo. REFUNDED nunca expone fileUrl digital."
      summary: Mis compras como comprador (auth, incluye snapshot itemTitle y fileUrl en digitales RELEASED)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /orders/sales:
    get:
      tags: [orders]
      summary: Ventas sobre mis publicaciones con comprador y reputación (auth, paginado keyset ?limit=50&cursor=orderId, responde {data, nextCursor})
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /orders/{id}:
    get:
      tags: [orders]
      summary: Detalle (comprador, vendedor o moderación)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '404': { description: NOT_FOUND } }
  /orders/{id}/accept:
    post:
      tags: [orders]
      summary: El vendedor acepta compra o alquiler bazar PENDING → ACCEPTED (409 si expiró o no es bazar)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: BAD_STATE, NOT_RENTAL o RESERVATION_EXPIRED } }
  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Digital solamente. Cuenta activa y foto JPG/PNG propia obligatorias; operación opcional. PENDING→ACCEPTED→PAID, o reenvío PAID denegado. Sin desbloquear.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentAccountId, payProofUrl]
              properties:
                paymentAccountId: { type: string, minLength: 1 }
                payProof: { type: string, minLength: 3, maxLength: 160, description: Operación opcional }
                payProofUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$', description: Foto propia JPG/PNG existente }
      responses:
        '200': { description: '{ data: Order } PAID, copia cuenta destino, limpia TTL y denegación; avisos a comprador, vendedor y trabajador.' }
        '400': { description: VALIDATION, BAD_PHOTO o ACCOUNT_INACTIVE }
        '401': { description: Sin sesión }
        '403': { description: Solo comprador }
        '409': { description: PHYSICAL_PAYMENT, BAD_STATE o RESERVATION_EXPIRED }
  /orders/{id}/reject:
    post:
      tags: [orders]
      summary: Rechazar solicitud PENDING del bazar (solo vendedor), libera artículo y avisa motivo al comprador
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses: { '200': { description: Pedido cancelado }, '400': { description: Motivo inválido }, '403': { description: Solo vendedor }, '409': { description: BAD_STATE } }
  /orders/{id}/confirm-payment:
    post:
      tags: [orders]
      summary: Desactivado por RFC0003. Solo el equipo verifica; 409 TEAM_VERIFICATION (físico PHYSICAL_PAYMENT).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '401': { description: Sin sesión }, '403': { description: FORBIDDEN }, '409': { description: TEAM_VERIFICATION, TEAM_SETTLEMENT, TEAM_PAYMENT_REQUIRED o PHYSICAL_PAYMENT según operación } }
  /orders/{id}/cancel:
    post:
      tags: [orders]
