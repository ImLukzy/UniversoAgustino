        '400': { description: VALIDATION (correo no autorizado o inválido) }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
        '404': { description: USER_NOT_FOUND (la persona aún no ingresó) }
        '409': { description: ALREADY_STAFF }
