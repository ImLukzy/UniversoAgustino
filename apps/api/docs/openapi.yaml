openapi: 3.0.3
info:
  title: Universo Agustino API
  version: 1.0.0
  description: API v1 - marketplace académico UNSA (comunidad @unsa.edu.pe). Intermediación por el equipo; comisión del 13 % a cargo del vendedor.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - { name: auth }
  - { name: documents }
  - { name: payments }
  - { name: bazar }
  - { name: orders }
  - { name: uploads }
  - { name: monetization }
  - { name: reports }
  - { name: legal }
  - { name: staff }
paths:
  /staff/payouts/{id}/refund:
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Técnico registra devolución íntegra congelada con foto propia; Order ESCROW y Payout FROZEN refundRequired pasan REFUNDED bajo lock300030
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proofUrl]
              properties:
                proofUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
                paymentRef: { type: string, minLength: 3, maxLength: 160 }
      responses:
        '200': { description: 'Payout REFUNDED con refundProofUrl/refundPaymentRef/refundedAt/refundedById; grant revocado conservado, reportes ACTIONED, auditoría y avisos/correo a comprador/vendedor/cobrador. No liquidación ni comisión. Físico en custodia pasa BACK_TO_SELLER, stock solo vuelve AVAILABLE tras entrega al vendedor.' }
        '400': { description: 'Foto propia JPG/PNG obligatoria o cuerpo inválido; montos del cliente rechazados' }
        '401': { description: 'Sin sesión' }
        '403': { description: 'Solo Técnico vigente' }
        '404': { description: 'Liquidación inexistente' }
        '409': { description: 'BAD_STATE si no FROZEN/refundRequired/ESCROW o repetido; RETURN_REQUIRED si físico aún entregado/alquilado, primero recepción en sede' }
  /staff/payouts/{id}/refund-required:
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Técnico decide devolver con motivo auditado; conserva FROZEN y marca Requiere reembolso. No transfiere dinero, cambia Order ni revoca grant
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 5, maxLength: 300 } } }
      responses:
        '200': { description: "Payout FROZEN con decisión, avisos y correo a participantes" }
        '400': { description: "Motivo inválido" }
        '401': { description: "Sin sesión" }
        '403': { description: "Solo Técnico" }
        '404': { description: "Liquidación inexistente" }
        '409': { description: "No congelada, decisión repetida o Order no ESCROW" }
  /staff/payouts:
    get:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Liquidaciones propias del cobrador o todas para Técnico; FIFO vencimiento, historial por fecha de pago, no-store
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, COMPLETED, FROZEN, REFUNDED], default: PENDING } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: "data Payout[] hasta50, nextPage nullable; artículo, comprador, vendedor y cuenta del vendedor" }
        '400': { description: "Consulta inválida" }
        '401': { description: "Sin sesión" }
        '403': { description: "No es miembro actual" }
  /orders/payouts:
    get:
      tags: [orders]
      description: "REFUNDED informa estado sin foto u operación de devolución al comprador; snapshots históricos conservados, neto no liquidable."
      security: [{ bearerAuth: [] }]
      summary: Mis cobros del vendedor; solo propias, precios/comisión/neto congelados, estado y comprobante privado del equipo. Sin cuentas del equipo ni comprador
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: "data Payout[] hasta50 y nextPage nullable" }
        '400': { description: "Página inválida" }
        '401': { description: "Sin sesión" }
  /staff/payouts/earnings:
    get:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Suma exclusivamente feeCents de pedidos verificados durante periodo excluyendo Order/Payout REFUNDED; cobrador propio o Técnico global con desglose por trabajador
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: "data commissionCents, verifiedCount, collectors; intervalo from inclusivo/to exclusivo, máximo366 días" }
        '400': { description: "Periodo inválido" }
        '401': { description: "Sin sesión" }
        '403': { description: "No es miembro actual" }
  /staff/payouts/{id}/complete:
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Cobrador o Técnico registra foto propia JPG/PNG, liquida neto congelado y pasa Order a RELEASED atómicamente; avisos y correo vendedor/equipo, aviso comprador
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proofUrl]
              properties:
                proofUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
                paymentRef: { type: string, minLength: 3, maxLength: 160 }
      responses:
        '200': { description: "Payout COMPLETED con foto privada para vendedor y equipo" }
        '400': { description: "Foto ausente/ajena/inválida" }
        '401': { description: "Sin sesión" }
        '403': { description: "Cobrador ajeno o rol revocado" }
        '404': { description: "Liquidación inexistente" }
        '409': { description: "Congelada, completada o pedido no ESCROW" }
  /staff/payouts/{id}/resume:
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Solo Técnico resuelve un reclamo autorizando liquidar; exige motivo auditado, FROZEN a PENDING sin cambiar Order ni grant
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 300 } } }
      responses:
        '200': { description: "Payout PENDING y avisos vendedor/cobrador" }
        '400': { description: "Motivo inválido" }
        '401': { description: "Sin sesión" }
        '403': { description: "Solo Técnico" }
        '404': { description: "Liquidación inexistente" }
        '409': { description: "No está congelada o pedido no ESCROW" }
  /documents/{id}/download:
    get:
      tags: [documents]
      description: "Grant activo revokedAt null; reembolso bloquea descarga y URL cruda del snapshot histórico. Recompra permite nuevo grant sin reutilizar el revocado."
      security: [{ bearerAuth: [] }]
      summary: Descarga autorizada permanente. Usa archivo congelado del comprador; PDF con correo como marca de agua, no-store. Grant no expira ni depende de liquidación.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Archivo adjunto; PDF mantiene todas las páginas }
        '401': { description: Sin sesión }
        '403': { description: PAYWALL, PAID no basta }
        '404': { description: Documento o archivo no disponible }
  /staff/payments:
    get:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Primeros50 comprobantes digitales PAID pendientes de cuenta propia; Técnico global. Producto/detalles/comprador/monto/destino/foto. Rol actual de BD y no-store.
      responses:
        '200': { description: '{ data: Order[] } con buyer perfil/nombre/correo y document curso/descripción' }
        '401': { description: Sin sesión }
        '403': { description: Solo equipo actual }
  /staff/payments/{id}/accept:
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Verifica PAID→ESCROW; acceso permanente + Payout PENDING neto del snapshot, dueAt48h, escrow y auditoría en una transacción. Avisos comprador/vendedor/equipo después del commit.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ data: Order } con verifiedAt y paymentReviewedById' }
        '400': { description: BAD_PHOTO }
        '401': { description: Sin sesión }
        '403': { description: Solo trabajador de cuenta destino o Técnico actuales }
        '404': { description: Pedido inexistente }
        '409': { description: BAD_STATE, DOCUMENT_UNAVAILABLE o conflicto de unicidad. Repetido no crea otro acceso/payout/aviso. }
  /staff/payments/{id}/deny:
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Guarda motivo y revisor; conserva PAID sin acceso/payout, avisa a ambas partes y permite reenviar foto.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 5, maxLength: 300 } }
      responses:
        '200': { description: '{ data: Order } con paymentRejectedReason' }
        '400': { description: VALIDATION }
        '401': { description: Sin sesión }
        '403': { description: Cuenta ajena o exmiembro }
        '404': { description: Pedido inexistente }
        '409': { description: BAD_STATE }
  /staff/payment-accounts:
    get:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Cuentas propias del trabajador; todas para el técnico. Respuesta privada no cacheable.
      responses:
        '200': { description: '{ data: PaymentAccount[] }' }
        '401': { description: Sin sesión }
        '403': { description: Solo equipo }
    post:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Crear cuenta propia o del equipo (técnico). Fotos JPG/PNG propias y existentes, auditado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/PaymentAccountInput' }
                - type: object
                  required: [userId]
                  properties: { userId: { type: string, minLength: 1 } }
      responses:
        '201': { description: '{ data: PaymentAccount }' }
        '400': { description: Contrato inválido / NOT_STAFF / BAD_PHOTO }
        '401': { description: Sin sesión }
        '403': { description: Solo equipo y propietario, salvo técnico }
  /staff/payment-accounts/{id}:
    patch:
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: Editar, activar o desactivar. Propietario inmutable; solo dueño o técnico.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentAccountInput' }
      responses:
        '200': { description: '{ data: PaymentAccount }' }
        '400': { description: Contrato inválido / BAD_PHOTO }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso }
        '404': { description: NOT_FOUND }
  /orders/{id}/payment-accounts:
    get:
      tags: [orders]
      security: [{ bearerAuth: [] }]
      summary: Cuentas activas del equipo; solo comprador de pedido PENDING vigente, ACCEPTED o PAID. Nunca público.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ data: PaymentAccount[] } sin fechas ni datos públicos' }
        '401': { description: Sin sesión }
        '404': { description: Pedido ajeno, vencido o inactivo }
  /health:
    get:
      tags: [auth]
      summary: Liveness
      responses: { '200': { description: OK } }
  /ready:
    get:
      tags: [auth]
      summary: Readiness (SELECT 1 en BD)
      responses: { '200': { description: OK } }
  /auth/register:
    post:
      tags: [auth]
      summary: Registro (rol inicial creator, solo @unsa.edu.pe + excepción)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, example: rosa.quispe@unsa.edu.pe }
                password: { type: string, minLength: 8 }
                fullName: { type: string }
                university: { type: string, enum: [UNSA] }
                career: { type: string, description: "Clave de CareerSchema (p. ej. ENFERMERIA)" }
                cycle: { type: string }
      responses:
        '201': { description: Creado (devuelve access) }
        '400': { description: VALIDATION }
        '403': { description: EMAIL_NO_AUTORIZADO }
        '409': { description: EMAIL_TAKEN }
  /auth/login:
    post:
      tags: [auth]
      summary: Login (emite access + cookie httpOnly hub_refresh)
      responses:
        '200': { description: OK }
        '401': { description: BAD_CREDENTIALS }
  /auth/oauth/status:
    get:
      tags: [auth]
      summary: Qué proveedores sociales están configurados (google/apple)
      responses:
        '200': { description: OK }
  /auth/oauth/google:
    get:
      tags: [auth]
      summary: Inicia OAuth Google (redirect 302 al proveedor)
      responses:
        '302': { description: Redirect a accounts.google.com }
        '503': { description: OAUTH_NO_CONFIGURADO }
  /auth/oauth/google/callback:
    get:
      tags: [auth]
      summary: Callback Google (verifica, chequea dominio UNSA, emite sesión)
      responses:
        '302': { description: Redirect a /auth/callback con code o error }
  /auth/oauth/apple:
    get:
      tags: [auth]
      summary: Inicia Sign in with Apple (redirect 302 al proveedor)
      responses:
        '302': { description: Redirect a appleid.apple.com }
        '503': { description: OAUTH_NO_CONFIGURADO }
  /auth/oauth/apple/callback:
    post:
      tags: [auth]
      summary: Callback Apple form_post (verifica id_token, chequea dominio)
      responses:
        '302': { description: Redirect a /auth/callback con code o error }
  /auth/oauth/consume:
    post:
      tags: [auth]
      summary: Canjea el código de un solo uso por access (mismo contrato que login)
      responses:
        '200': { description: OK }
        '400': { description: CODE_INVALIDO }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rota el refresh (cookie) y emite access. Requiere Origin permitido
      responses:
        '200': { description: OK }
        '401': { description: UNAUTHENTICATED o TOKEN_EXPIRED }
        '403': { description: Origen no permitido }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoca el refresh y limpia la cookie
      responses: { '200': { description: OK } }
  /auth/onboarding:
    post:
      tags: [auth]
      summary: Completa el perfil obligatorio de una cuenta nueva (spec 21, /bienvenida; una sola vez)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, faculty, career, cycle, phone]
              properties:
                fullName: { type: string, minLength: 5, maxLength: 120, description: Nombres y apellidos (2+ palabras) }
                faculty: { type: string, description: Facultad UNSA; debe corresponder a la carrera }
                career: { type: string, description: Carrera oficial UNSA }
                cycle: { type: string, description: Ciclo (I–XII) }
                phone: { type: string, description: Celular peruano de 9 dígitos }
      responses:
        '201': { description: Perfil guardado con onboardedAt }
        '400': { description: VALIDATION (p. ej. carrera fuera de la facultad) }
        '401': { description: Sin sesión }
        '409': { description: PERFIL_COMPLETO }
  /auth/email/start:
    post:
      tags: [auth]
      summary: Envía un código de 6 dígitos al correo @unsa.edu.pe (spec 22; 10/15min por IP, 5/hora por correo, 60 s entre envíos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'Código enviado ({ email, expiresIn, resendIn })' }
        '403': { description: EMAIL_NO_AUTORIZADO (dominio distinto de @unsa.edu.pe) }
        '429': { description: 'ESPERA_REENVIO (con retryIn) o RATE_LIMITED' }
        '502': { description: CORREO_FALLIDO }
        '503': { description: CORREO_NO_DISPONIBLE (sin proveedor de correo en producción) }
  /auth/email/verify:
    post:
      tags: [auth]
      summary: Canjea el código por sesión; crea la cuenta si es nueva (perfil pendiente → /bienvenida)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: 'Cuenta existente ({ access, isNew: false }) + cookie de refresh' }
        '201': { description: 'Cuenta creada ({ access, isNew: true }) + cookie de refresh' }
        '400': { description: CODIGO_INCORRECTO }
        '403': { description: EMAIL_NO_AUTORIZADO }
        '410': { description: CODIGO_VENCIDO (vencido, usado o inexistente) }
        '429': { description: DEMASIADOS_INTENTOS (5) o RATE_LIMITED }
  /auth/forgot:
    post:
      tags: [auth]
      summary: Solicita enlace de recuperación (202 neutro, anti-enumeración, 5/15min por IP + 3/hora por email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Aceptado (idéntico exista o no el usuario) }
        '400': { description: VALIDATION }
        '429': { description: RATE_LIMITED }
  /auth/reset:
    post:
      tags: [auth]
      summary: Restablece con token (un uso, 30min) y revoca sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 32 }
                password: { type: string, minLength: 10, description: "10+, minúscula, mayúscula y número" }
      responses:
        '200': { description: OK }
        '400': { description: VALIDATION }
        '410': { description: TOKEN_EXPIRED }
  /auth/me:
    get:
      tags: [auth]
      summary: Perfil propio (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '401': { description: UNAUTHENTICATED } }
  /auth/profile:
    patch:
      tags: [auth]
      summary: Edita fullName/career/cycle propios (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '400': { description: VALIDATION } }
  /documents:
    get:
      tags: [documents]
      summary: Listar apuntes PUBLISHED (público, paginado)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: university, in: query, schema: { type: string } }
        - { name: career, in: query, schema: { type: string } }
        - { name: course, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [APUNTE, PAE, BALOTARIO, GUIA] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 12 } }
      responses: { '200': { description: OK } }
    post:
      tags: [documents]
      summary: Crear apunte (auth, hereda career del perfil)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Creado }, '400': { description: VALIDATION } }
  /documents/mine:
    get:
      tags: [documents]
      summary: Mis apuntes (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /documents/{id}:
    get:
      tags: [documents]
      summary: Detalle público (404 si no existe); con token añade saved y fullAccess reales. fileType (pdf|image|null) siempre; fileUrl solo con fullAccess
      security: [{}, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND } }
  /documents/{id}/preview:
    get:
      tags: [documents]
      summary: Vista previa pública con las páginas de muestra que eligió el vendedor (previewPages, default 1–2) o la imagen. Cabeceras X-Preview-Pages (páginas reales incluidas) y X-Total-Pages. Cache-Control private
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: PDF con las páginas de muestra o imagen }, '404': { description: NOT_FOUND } }
    patch:
      tags: [documents]
      summary: Edita el dueño (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '404': { description: NOT_FOUND } }
    delete:
      tags: [documents]
      summary: Elimina el dueño; 409 si hay pedidos vivos (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND }, '409': { description: CONFLICT_ACTIVE_ORDERS } }
  /documents/{id}/save:
    post:
      tags: [documents]
      summary: Guardar documento (idempotente, auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { 200: { description: OK }, 401: { description: UNAUTHENTICATED }, 404: { description: NOT_FOUND } }
    delete:
      tags: [documents]
      summary: Quitar de guardados (idempotente, auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { 200: { description: OK }, 401: { description: UNAUTHENTICATED } }
  /documents/{id}/takedown:
    post:
      tags: [documents]
      summary: Baja por moderación D.L. 822 (moderator/admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN } }
  /bazar:
    get:
      tags: [bazar]
      summary: Listar bazar AVAILABLE (público, paginado)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [LIBRO, SCRUB, INSTRUMENTO, APUNTE] } }
        - { name: tx, in: query, schema: { type: string, enum: [VENTA, ALQUILER] } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
    post:
      tags: [bazar]
