      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '401': { description: Sin sesión }, '403': { description: FORBIDDEN }, '409': { description: TEAM_VERIFICATION, TEAM_SETTLEMENT, TEAM_PAYMENT_REQUIRED o PHYSICAL_PAYMENT según operación } }
  /uploads:
    post:
      tags: [uploads]
      summary: Sube PDF/JPG/PNG/EPUB 25MB (auth, campo file). purpose payment-proof crea archivo privado; team-account solo equipo. Verifica firma, UUID, dedup privado. 413 tamaño, 415 firma.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Creado (url, name, size, mime) }
        '400': { description: VALIDATION }
        '413': { description: FILE_TOO_LARGE }
        '415': { description: UNSUPPORTED_FILE_TYPE }
  /uploads/{name}:
    get:
      tags: [uploads]
      summary: "Sirve archivo con cabeceras defensivas (inline solo pdf/jpg/png, resto attachment). Archivo de un documento de pago solo para autor, comprador con grant o ESCROW/RELEASED, o equipo; PAID no basta. Comprobantes privados solo para partes autorizadas: físico al comprador propio/equipo, liquidación al vendedor propio/equipo; ?stream=1 transmite por la API (Range → 206)"
      security: [{}, { bearerAuth: [] }]
      parameters:
