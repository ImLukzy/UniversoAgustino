      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [document, bazar] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "{data: {id, reviewStatus: APPROVED, reviewNote: null, reviewedById, reviewedAt}}" }
        '400': { description: VALIDATION }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409': { description: BAD_STATE (solo desde PENDING) }
  /staff/reviews/{type}/{id}/reject:
    post:
      tags: [staff]
