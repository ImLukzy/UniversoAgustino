      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [document, bazar], default: document } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: "{data: [{id, type, title, priceCents, description, createdAt, previewUrl, author: {id, email, fullName, approvedCount}}], total, pendingTotal, page, pageSize}" }
        '400': { description: VALIDATION }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
