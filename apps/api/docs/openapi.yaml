          schema: { type: string }
      responses:
        "200": { description: Operación completada; data contiene caso o cita }
        "400": { description: VALIDATION o BAD_PHOTO }
        "401": { description: Sesión requerida }
        "403": { description: Solo custodio o Técnico }
        "404": { description: Caso no visible o inexistente }
        "409": { description: BAD_STATE, SLOT_TAKEN, DEADLINE_EXCEEDED, RESCHEDULE_LIMIT o HAS_APPOINTMENTS }
  /cases/{id}/messages:
