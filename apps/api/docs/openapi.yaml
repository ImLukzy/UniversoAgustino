    get:
      tags: [legal]
      summary: Resumen D.L. 822 (SLA takedown 48h)
      responses: { '200': { description: OK } }
  /staff/members:
    get:
      tags: [staff]
      summary: Lista miembros del equipo (moderator o admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Miembros y fecha de alta auditada (fecha de cuenta si no hay alta registrada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, email, fullName, role, since]
                      properties:
                        id: { type: string }
                        email: { type: string, format: email }
                        fullName: { type: string }
                        role: { type: string, enum: [moderator, admin] }
                        since: { type: string, format: date-time }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
    post:
      tags: [staff]
      summary: Añade moderador por correo UNSA o excepción (solo admin); registra AuditLog
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 160 }
      responses:
        '200': { description: "{data: {id, email, fullName, role: moderator, since}}; rol aplica al rotar access" }
        '400': { description: VALIDATION (correo no autorizado o inválido) }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
        '404': { description: USER_NOT_FOUND (la persona aún no ingresó) }
        '409': { description: ALREADY_STAFF }
  /staff/members/{userId}:
    delete:
      tags: [staff]
      summary: Retira moderador (solo admin), revoca refresh tokens y registra AuditLog
      security: [{ bearerAuth: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{data: {id, role: creator}}; access existente vence en JWT_ACCESS_TTL" }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
        '404': { description: USER_NOT_FOUND }
        '409': { description: SELF_REMOVE, IS_ADMIN o NOT_STAFF }
  /staff/reviews:
    get:
      tags: [staff]
      summary: Cola FIFO de publicaciones PENDING (moderator o admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [document, bazar], default: document } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: "{data: [{id, type, title, priceCents, description, createdAt, previewUrl, author: {id, email, fullName, approvedCount}}], total, pendingTotal, page, pageSize}" }
        '400': { description: VALIDATION }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
  /staff/reviews/{type}/{id}/approve:
    post:
      tags: [staff]
      summary: Aprueba publicación PENDING, audita y notifica al autor
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [document, bazar] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "{data: {id, reviewStatus: APPROVED, reviewNote: null, reviewedById, reviewedAt}}" }
        '400': { description: VALIDATION }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409': { description: BAD_STATE (solo desde PENDING) }
  /staff/reviews/{type}/{id}/reject:
    post:
      tags: [staff]
      summary: Rechaza publicación PENDING con motivo, audita y notifica al autor
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [document, bazar] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 300, description: Se recortan espacios al inicio y al final }
      responses:
        '200': { description: "{data: {id, reviewStatus: REJECTED, reviewNote, reviewedById, reviewedAt}}" }
        '400': { description: VALIDATION (motivo obligatorio) }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409': { description: BAD_STATE (solo desde PENDING) }
