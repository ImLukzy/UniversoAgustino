openapi: 3.0.3
info:
  title: Universo Agustino API
  version: 1.0.0
  description: API v1 - marketplace académico UNSA (comunidad @unsa.edu.pe). Compra en custodia con comisión del 13%.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - { name: auth }
  - { name: documents }
  - { name: payments }
  - { name: bazar }
  - { name: orders }
  - { name: uploads }
  - { name: monetization }
  - { name: reports }
  - { name: legal }
paths:
  /health:
    get:
      tags: [auth]
      summary: Liveness
      responses: { '200': { description: OK } }
  /ready:
    get:
      tags: [auth]
      summary: Readiness (SELECT 1 en BD)
      responses: { '200': { description: OK } }
  /auth/register:
    post:
      tags: [auth]
      summary: Registro (rol inicial creator, solo @unsa.edu.pe + excepción)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, example: rosa.quispe@unsa.edu.pe }
                password: { type: string, minLength: 8 }
                fullName: { type: string }
                university: { type: string, enum: [UNSA] }
                career: { type: string, description: "Clave de CareerSchema (p. ej. ENFERMERIA)" }
                cycle: { type: string }
      responses:
        '201': { description: Creado (devuelve access) }
        '400': { description: VALIDATION }
        '403': { description: EMAIL_NO_AUTORIZADO }
        '409': { description: EMAIL_TAKEN }
  /auth/login:
    post:
      tags: [auth]
      summary: Login (emite access + cookie httpOnly hub_refresh)
      responses:
        '200': { description: OK }
        '401': { description: BAD_CREDENTIALS }
  /auth/oauth/status:
    get:
      tags: [auth]
      summary: Qué proveedores sociales están configurados (google/apple)
      responses:
        '200': { description: OK }
  /auth/oauth/google:
    get:
      tags: [auth]
      summary: Inicia OAuth Google (redirect 302 al proveedor)
      responses:
        '302': { description: Redirect a accounts.google.com }
        '503': { description: OAUTH_NO_CONFIGURADO }
  /auth/oauth/google/callback:
    get:
      tags: [auth]
      summary: Callback Google (verifica, chequea dominio UNSA, emite sesión)
      responses:
        '302': { description: Redirect a /auth/callback con code o error }
  /auth/oauth/apple:
    get:
      tags: [auth]
      summary: Inicia Sign in with Apple (redirect 302 al proveedor)
      responses:
        '302': { description: Redirect a appleid.apple.com }
        '503': { description: OAUTH_NO_CONFIGURADO }
  /auth/oauth/apple/callback:
    post:
      tags: [auth]
      summary: Callback Apple form_post (verifica id_token, chequea dominio)
      responses:
        '302': { description: Redirect a /auth/callback con code o error }
  /auth/oauth/consume:
    post:
      tags: [auth]
      summary: Canjea el código de un solo uso por access (mismo contrato que login)
      responses:
        '200': { description: OK }
        '400': { description: CODE_INVALIDO }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rota el refresh (cookie) y emite access. Requiere Origin permitido
      responses:
        '200': { description: OK }
        '401': { description: UNAUTHENTICATED o TOKEN_EXPIRED }
        '403': { description: Origen no permitido }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoca el refresh y limpia la cookie
      responses: { '200': { description: OK } }
  /auth/email/start:
    post:
      tags: [auth]
      summary: Envía un código de 6 dígitos al correo @unsa.edu.pe (spec 22; 10/15min por IP, 5/hora por correo, 60 s entre envíos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'Código enviado ({ email, expiresIn, resendIn })' }
        '403': { description: EMAIL_NO_AUTORIZADO (dominio distinto de @unsa.edu.pe) }
        '429': { description: 'ESPERA_REENVIO (con retryIn) o RATE_LIMITED' }
        '502': { description: CORREO_FALLIDO }
        '503': { description: CORREO_NO_DISPONIBLE (sin proveedor de correo en producción) }
  /auth/email/verify:
    post:
      tags: [auth]
      summary: Canjea el código por sesión; crea la cuenta si es nueva (perfil pendiente → /bienvenida)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: 'Cuenta existente ({ access, isNew: false }) + cookie de refresh' }
        '201': { description: 'Cuenta creada ({ access, isNew: true }) + cookie de refresh' }
        '400': { description: CODIGO_INCORRECTO }
        '403': { description: EMAIL_NO_AUTORIZADO }
        '410': { description: CODIGO_VENCIDO (vencido, usado o inexistente) }
        '429': { description: DEMASIADOS_INTENTOS (5) o RATE_LIMITED }
  /auth/forgot:
    post:
      tags: [auth]
      summary: Solicita enlace de recuperación (202 neutro, anti-enumeración, 5/15min por IP + 3/hora por email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Aceptado (idéntico exista o no el usuario) }
        '400': { description: VALIDATION }
        '429': { description: RATE_LIMITED }
  /auth/reset:
    post:
      tags: [auth]
      summary: Restablece con token (un uso, 30min) y revoca sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 32 }
                password: { type: string, minLength: 10, description: "10+, minúscula, mayúscula y número" }
      responses:
        '200': { description: OK }
        '400': { description: VALIDATION }
        '410': { description: TOKEN_EXPIRED }
  /auth/me:
    get:
      tags: [auth]
      summary: Perfil propio (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '401': { description: UNAUTHENTICATED } }
  /auth/profile:
    patch:
      tags: [auth]
      summary: Edita fullName/career/cycle propios (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '400': { description: VALIDATION } }
  /documents:
    get:
      tags: [documents]
      summary: Listar apuntes PUBLISHED (público, paginado)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: university, in: query, schema: { type: string } }
        - { name: career, in: query, schema: { type: string } }
        - { name: course, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [APUNTE, PAE, BALOTARIO, GUIA] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 12 } }
      responses: { '200': { description: OK } }
    post:
      tags: [documents]
      summary: Crear apunte (auth, hereda career del perfil)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Creado }, '400': { description: VALIDATION } }
  /documents/mine:
    get:
      tags: [documents]
      summary: Mis apuntes (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /documents/{id}:
    get:
      tags: [documents]
      summary: Detalle público (404 si no existe); con token añade saved y fullAccess reales. fileType (pdf|image|null) siempre; fileUrl solo con fullAccess
      security: [{}, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND } }
  /documents/{id}/preview:
    get:
      tags: [documents]
      summary: Vista previa pública con las páginas de muestra que eligió el vendedor (previewPages, default 1–2) o la imagen. Cabeceras X-Preview-Pages (páginas reales incluidas) y X-Total-Pages. Cache-Control private
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: PDF con las páginas de muestra o imagen }, '404': { description: NOT_FOUND } }
    patch:
      tags: [documents]
      summary: Edita el dueño (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '404': { description: NOT_FOUND } }
    delete:
      tags: [documents]
      summary: Elimina el dueño; 409 si hay pedidos vivos (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND }, '409': { description: CONFLICT_ACTIVE_ORDERS } }
  /documents/{id}/save:
    post:
      tags: [documents]
      summary: Guardar documento (idempotente, auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { 200: { description: OK }, 401: { description: UNAUTHENTICATED }, 404: { description: NOT_FOUND } }
    delete:
      tags: [documents]
      summary: Quitar de guardados (idempotente, auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { 200: { description: OK }, 401: { description: UNAUTHENTICATED } }
  /documents/{id}/takedown:
    post:
      tags: [documents]
      summary: Baja por moderación D.L. 822 (moderator/admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN } }
  /bazar:
    get:
      tags: [bazar]
      summary: Listar bazar AVAILABLE (público, paginado)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
    post:
      tags: [bazar]
      summary: Publicar ítem (auth, photos máx 4)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Creado }, '400': { description: VALIDATION } }
  /bazar/mine:
    get:
      tags: [bazar]
      summary: Mis ítems (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /bazar/{id}:
    get:
      tags: [bazar]
      summary: Detalle público con vendedor (404 si no existe)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND } }
    patch:
      tags: [bazar]
      summary: Edita el dueño (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '404': { description: NOT_FOUND } }
    delete:
      tags: [bazar]
      summary: Elimina el dueño; 409 si hay pedidos vivos (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND }, '409': { description: CONFLICT_ACTIVE_ORDERS } }
  /bazar/{id}/reserve:
    post:
      tags: [bazar]
      summary: Marca RESERVED (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /orders:
    post:
      tags: [orders]
      summary: Crea pedido PENDING con TTL 30min + snapshot (auth). Alquiler bazar exige rentalStart/End
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemType, itemId]
              properties:
                itemType: { type: string, enum: [document, bazar] }
                itemId: { type: string }
                rentalStart: { type: string, format: date-time }
                rentalEnd: { type: string, format: date-time }
      responses:
        '200': { description: Apunte con pedido vivo del mismo comprador (PENDING/PAID) — se reutiliza, no se duplica }
        '201': { description: Creado (sellerId, expiresAt, itemTitle, itemPriceCents, feeBps) }
        '400': { description: SELF_PURCHASE, FREE_ITEM, DATES_REQUIRED o BAD_DATES }
        '409': { description: NOT_AVAILABLE (con details.availableAt) o ALREADY_OWNED }
  /orders/mine:
    get:
      tags: [orders]
      summary: Mis compras como comprador (auth, incluye snapshot itemTitle y fileUrl en digitales RELEASED)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /orders/sales:
    get:
      tags: [orders]
      summary: Ventas sobre mis publicaciones con comprador y reputación (auth, paginado keyset ?limit=50&cursor=orderId, responde {data, nextCursor})
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /orders/{id}:
    get:
      tags: [orders]
      summary: Detalle (comprador, vendedor o moderación)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '404': { description: NOT_FOUND } }
  /orders/{id}/accept:
    post:
      tags: [orders]
      summary: El vendedor acepta alquiler bazar PENDING → ACCEPTED (409 si expiró o no es bazar)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: BAD_STATE, NOT_RENTAL o RESERVATION_EXPIRED } }
  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: El comprador declara el pago → PAID (payProof = n° operación y/o payProofUrl = voucher propio; al menos uno). No da acceso hasta que el vendedor confirme (ESCROW). 409 GATEWAY_REQUIRED con Mercado Pago activo
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payProof: { type: string, minLength: 3, maxLength: 160, description: N° de operación Yape/Plin }
                payProofUrl: { type: string, pattern: "^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$", description: Captura del voucher subida por POST /uploads }
      responses: { '200': { description: OK }, '400': { description: VALIDATION o BAD_PROOF }, '403': { description: FORBIDDEN }, '409': { description: BAD_STATE, RESERVATION_EXPIRED o GATEWAY_REQUIRED } }
  /orders/{id}/confirm-payment:
    post:
      tags: [orders]
      summary: El vendedor confirma el abono → ESCROW (custodia)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '409': { description: BAD_STATE } }
  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Cancela comprador o vendedor (PENDING/ACCEPTED/PAID) con motivo
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK (cancelledReason BUYER_CANCELLED/SELLER_REJECTED) }, '409': { description: BAD_STATE } }
  /orders/{id}/confirm-receipt:
    post:
      tags: [orders]
      summary: El comprador confirma recepción ESCROW → RELEASED
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN }, '409': { description: BAD_STATE } }
  /orders/{id}/refund:
    post:
      tags: [orders]
      summary: Reembolso por moderación (moderator/admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN } }
  /uploads:
    post:
      tags: [uploads]
      summary: Sube PDF/JPG/PNG/EPUB 25MB (auth, campo file). Verifica firma, UUID, dedup. 413 si excede, 415 si el contenido no coincide
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Creado (url, name, size, mime) }
        '400': { description: VALIDATION }
        '413': { description: FILE_TOO_LARGE }
        '415': { description: UNSUPPORTED_FILE_TYPE }
  /uploads/{name}:
    get:
      tags: [uploads]
      summary: Sirve archivo con cabeceras defensivas (inline solo pdf/jpg/png, resto attachment). Archivo de un documento de pago solo para autor, comprador (PAID/ESCROW/RELEASED) o admin; ?stream=1 transmite por la API (Range → 206)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: stream, in: query, schema: { type: string, enum: ['1'] } }
      responses: { '200': { description: Archivo }, '206': { description: Rango parcial (stream) }, '302': { description: Redirección a URL prefirmada (R2) }, '400': { description: VALIDATION }, '403': { description: PAYWALL }, '404': { description: NOT_FOUND } }
  /monetization/simulate:
    post:
      tags: [monetization]
      summary: Calculadora de ingresos (comisión 13% por defecto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avgPrice: { type: number, example: 15 }
                salesPerMonth: { type: integer, example: 40 }
                bazarExtra: { type: number, example: 100 }
                feePct: { type: number, example: 13 }
      responses: { '200': { description: OK } }
  /reports:
    post:
      tags: [reports]
      summary: Crea reporte D.L. 822 (auth, reason mín 10)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Creado }, '400': { description: VALIDATION } }
    get:
      tags: [reports]
      summary: Cola global (moderator/admin, máx 50)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN } }
  /reports/mine:
    get:
      tags: [reports]
      summary: Mis reportes enviados (auth, máx 50)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /reports/{id}/action:
    post:
      tags: [reports]
      summary: Acción de moderación ACTIONED/DISMISSED; ACTIONED en document = TAKEDOWN (moderator/admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: FORBIDDEN } }
  /notifications:
    get:
      tags: [reports]
      summary: Mis notificaciones (auth, ?unread=1, paginado máx 50)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /notifications/read-all:
    post:
      tags: [reports]
      summary: Marca todo como leído (auth)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'OK (read: N)' } }
  /notifications/{id}/read:
    post:
      tags: [reports]
      summary: Marca una notificación propia como leída (auth)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: NOT_FOUND } }
  /payments/config:
    get:
      tags: [payments]
      summary: Pasarela activa (manual = Yape/Plin verificado por el vendedor; mercadopago = Checkout Pro)
      responses: { '200': { description: "{ data: { provider: manual | mercadopago } }" } }
  /payments/checkout/{orderId}:
    post:
      tags: [payments]
      summary: Crea la preferencia de Mercado Pago del pedido del comprador y devuelve la URL de pago
      security: [{ bearerAuth: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "{ data: { url } }" }, '403': { description: FORBIDDEN }, '404': { description: PROVIDER_OFF }, '409': { description: BAD_STATE o RESERVATION_EXPIRED } }
  /payments/webhook:
    post:
      tags: [payments]
      summary: Notificación de Mercado Pago. Valida x-signature (HMAC-SHA256), relee el pago y exige approved + external_reference + monto exacto → ESCROW
      responses: { '200': { description: "{ data: { outcome } }" }, '401': { description: BAD_SIGNATURE }, '404': { description: PROVIDER_OFF } }
  /legal/summary:
    get:
      tags: [legal]
      summary: Resumen D.L. 822 (SLA takedown 48h)
      responses: { '200': { description: OK } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
