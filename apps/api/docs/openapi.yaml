      type: object
      additionalProperties: false
      required: [paymentMethod, paymentConfirmed]
      description: Custodio o Técnico durante PICKUP vigente; cobra al equipo y verifica antes de entregar. OPERATION exige cuenta activa y foto propia; operación opcional. CASH no necesita cuenta/foto y se atribuye al actor. Ambos crean Payout neto PENDING48h y Order PAID→ESCROW. Venta SOLD/CLOSED; alquiler RENTED con RETURN opcional. Solo complete de liquidación38 pasa RELEASED.
      oneOf:
        - required: [paymentAccountId, paymentProofUrl]
          properties:
            paymentMethod: { type: string, enum: [OPERATION] }
        - properties:
            paymentMethod: { type: string, enum: [CASH] }
          not:
            anyOf:
              - required: [paymentAccountId]
              - required: [paymentProofUrl]
              - required: [paymentRef]
      properties:
        paymentMethod: { type: string, enum: [OPERATION, CASH] }
        paymentConfirmed: { type: boolean, enum: [true] }
        paymentAccountId: { type: string, minLength: 1 }
        paymentProofUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        paymentRef: { type: string, minLength: 3, maxLength: 160, description: Opcional para OPERATION }
        returnAppointment:
          allOf:
            - { $ref: '#/components/schemas/CaseBooking' }
            - type: object
              properties:
                kind: { type: string, enum: [RETURN] }
    CaseReturnReview:
      type: object
      required: [condition, conditionNote, reviewConfirmed]
      description: Durante RETURN vigente, revisión explícita; guarda evidencia separada de recepción original; conserva estado financiero ESCROW o RELEASED sin liberar dinero. El objeto permanece RENTED hasta BACK_TO_SELLER; allí Order.physicalClosedAt y el índice de reservas permiten una nueva solicitud aunque Payout siga pendiente físico. Observaciones no disparan sanciones ni cargos automáticos.
      properties:
        condition: { type: string, enum: [OK, DAMAGED] }
        conditionNote: { type: string, minLength: 5, maxLength: 500 }
        reviewConfirmed: { type: boolean, enum: [true] }
        photoUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$', description: Opcional; JPG o PNG propio existente }
    CasePaymentReport:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    CaseState:
      type: string
      enum: [UNASSIGNED, ASSIGNED, DROP_SCHEDULED, IN_CUSTODY, PICKUP_SCHEDULED, DELIVERED, RENTED_OUT, RETURN_SCHEDULED, RETURNED, BACK_TO_SELLER, CLOSED, CANCELLED]
    CaseAssignment:
      type: object
      required: [assigneeId]
      properties:
        assigneeId: { type: string, minLength: 1 }
    CaseBooking:
      type: object
      required: [kind, sedeId, startsAt]
      description: Franja futura de 15 minutos alineada, dentro del turno del custodio, sin domingos/feriados ni solapes. Plazo al cierre del tercer día hábil posterior a aceptación (DROP_OFF) o recepción (PICKUP); sábado abierto cuenta. RETURN parte de la fecha final local y del primer día hábil con turno, con ventana fija de tres días hábiles; no cambia rentalEnd ni bloquea el recojo por día cerrado. BACK_TO_SELLER tiene ancla fija en segunda ausencia de recojo o revisión de devolución. Reprogramación conserva plazo original y solo una por tipo tras NO_SHOW.
      properties:
        kind: { type: string, enum: [DROP_OFF, PICKUP, RETURN, BACK_TO_SELLER] }
        sedeId: { type: string, minLength: 1 }
        startsAt: { type: string, format: date-time }
    CaseReceive:
      type: object
      required: [photoUrl, conditionNote]
      description: Solo custodio asignado, durante cita DROP_OFF vigente; foto JPG/PNG existente y propia del trabajador.
      properties:
        photoUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        conditionNote: { type: string, minLength: 5, maxLength: 500 }
    ReviewFields:
      type: object
      description: Campos de Document y BazarItem; listados públicos solo APPROVED. Detalle y preview no aprobados devuelven 404 a terceros; dueño y equipo pueden consultarlos. Compra requiere APPROVED. Editar REJECTED reenvía a PENDING.
      properties:
        reviewStatus: { type: string, enum: [PENDING, APPROVED, REJECTED], default: APPROVED }
        reviewNote: { type: string, nullable: true, maxLength: 300 }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedById: { type: string, nullable: true }
    PaymentAccountInput:
      type: object
      required: [method, holder, number, photoUrl, qrUrl]
      properties:
        method: { type: string, enum: [YAPE, PLIN, OTHER] }
        holder: { type: string, minLength: 3, maxLength: 120 }
        number: { type: string, minLength: 3, maxLength: 80 }
        photoUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        qrUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        active: { type: boolean, default: true }
    PaymentAccount:
      allOf:
        - { $ref: '#/components/schemas/PaymentAccountInput' }
        - type: object
          properties:
            id: { type: string }
            userId: { type: string }
    DigitalPaymentFields:
      type: object
      description: Datos privados. Comprador activo ve destino del equipo; vendedor no lo ve ni obtiene voucher. Snapshot vendedor nunca se expone al comprador. Acceso permanente independiente de status con DocumentAccessGrant.
      properties:
        paymentAccountId: { type: string, nullable: true }
        payHolder: { type: string, nullable: true }
        payPhotoUrl: { type: string, nullable: true }
        proofSubmittedAt: { type: string, format: date-time, nullable: true }
        paymentRejectedReason: { type: string, maxLength: 300, nullable: true }
        paymentReviewedAt: { type: string, format: date-time, nullable: true }
        paymentReviewedById: { type: string, nullable: true }
        physicalClosedAt: { type: string, format: date-time, nullable: true, description: Cierre físico independiente de liquidación; excluye reserva viva del bazar }
        verifiedAt: { type: string, format: date-time, nullable: true }
    Payout:
      type: object
      description: Liquidación38; pendientes, congeladas, historial y Mis cobros. Montos congelados, cuenta del vendedor separada del destino del comprador.
      properties:
        id: { type: string }
        orderId: { type: string }
        sellerId: { type: string }
        collectorId: { type: string }
        amountCents: { type: integer }
        feeCents: { type: integer }
        netCents: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED, FROZEN, REFUNDED] }
        dueAt: { type: string, format: date-time }
        refundRequired: { type: boolean }
        refundProofUrl: { type: string, nullable: true }
        refundPaymentRef: { type: string, nullable: true }
        refundedAt: { type: string, format: date-time, nullable: true }
        refundedById: { type: string, nullable: true }
