      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK (cancelledReason BUYER_CANCELLED/SELLER_REJECTED) }, '409': { description: BAD_STATE } }
  /orders/{id}/confirm-receipt:
    post:
      tags: [orders]
      summary: Desactivado. La descarga no necesita confirmación y el equipo liquida; 409 TEAM_SETTLEMENT (físico PHYSICAL_PAYMENT).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '401': { description: Sin sesión }, '403': { description: FORBIDDEN }, '409': { description: TEAM_VERIFICATION, TEAM_SETTLEMENT, TEAM_PAYMENT_REQUIRED o PHYSICAL_PAYMENT según operación } }
  /orders/{id}/refund:
    post:
      tags: [orders]
