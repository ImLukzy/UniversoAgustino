components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CasePickup:
      type: object
      required: [paymentMethod, paymentConfirmed]
      description: Custodio o Técnico durante PICKUP vigente. Solo entrega si certifica pago al vendedor; CASH guarda efectivo, OPERATION exige referencia. Venta pasa PAID→ESCROW→RELEASED y SOLD/CLOSED; alquiler PAID→ESCROW y RENTED, con RETURN adjunta opcional. El aviso del vendedor ofrece Confirmar cobro y No recibí el pago; ninguno altera el pedido.
      properties:
        paymentMethod: { type: string, enum: [OPERATION, CASH] }
        paymentConfirmed: { type: boolean, enum: [true] }
        paymentRef: { type: string, minLength: 3, maxLength: 160, description: Obligatorio para OPERATION }
        returnAppointment:
          allOf:
            - { $ref: '#/components/schemas/CaseBooking' }
            - type: object
              properties:
                kind: { type: string, enum: [RETURN] }
    CaseReturnReview:
      type: object
      required: [condition, conditionNote, reviewConfirmed]
      description: Durante RETURN vigente, revisión explícita; guarda evidencia separada de recepción original y pasa ESCROW→RELEASED. El objeto permanece RENTED hasta BACK_TO_SELLER físico. Observaciones no disparan sanciones ni cargos automáticos.
      properties:
        condition: { type: string, enum: [OK, DAMAGED] }
        conditionNote: { type: string, minLength: 5, maxLength: 500 }
        reviewConfirmed: { type: boolean, enum: [true] }
        photoUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$', description: Opcional; JPG o PNG propio existente }
    CasePaymentReport:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    CaseState:
      type: string
      enum: [UNASSIGNED, ASSIGNED, DROP_SCHEDULED, IN_CUSTODY, PICKUP_SCHEDULED, DELIVERED, RENTED_OUT, RETURN_SCHEDULED, RETURNED, BACK_TO_SELLER, CLOSED, CANCELLED]
    CaseAssignment:
      type: object
      required: [assigneeId]
      properties:
        assigneeId: { type: string, minLength: 1 }
    CaseBooking:
      type: object
      required: [kind, sedeId, startsAt]
      description: Franja futura de 15 minutos alineada, dentro del turno del custodio, sin domingos/feriados ni solapes. Plazo al cierre del tercer día hábil posterior a aceptación (DROP_OFF) o recepción (PICKUP); sábado abierto cuenta. RETURN parte de la fecha final local y del primer día hábil con turno, con ventana fija de tres días hábiles; no cambia rentalEnd ni bloquea el recojo por día cerrado. BACK_TO_SELLER tiene ancla fija en segunda ausencia de recojo o revisión de devolución. Reprogramación conserva plazo original y solo una por tipo tras NO_SHOW.
      properties:
        kind: { type: string, enum: [DROP_OFF, PICKUP, RETURN, BACK_TO_SELLER] }
        sedeId: { type: string, minLength: 1 }
        startsAt: { type: string, format: date-time }
    CaseReceive:
      type: object
      required: [photoUrl, conditionNote]
      description: Solo custodio asignado, durante cita DROP_OFF vigente; foto JPG/PNG existente y propia del trabajador.
      properties:
        photoUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        conditionNote: { type: string, minLength: 5, maxLength: 500 }
    ReviewFields:
      type: object
      description: Campos de Document y BazarItem; listados públicos solo APPROVED. Detalle y preview no aprobados devuelven 404 a terceros; dueño y equipo pueden consultarlos. Compra requiere APPROVED. Editar REJECTED reenvía a PENDING.
      properties:
        reviewStatus: { type: string, enum: [PENDING, APPROVED, REJECTED], default: APPROVED }
        reviewNote: { type: string, nullable: true, maxLength: 300 }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedById: { type: string, nullable: true }
    PaymentAccountInput:
      type: object
      required: [method, holder, number, photoUrl, qrUrl]
      properties:
        method: { type: string, enum: [YAPE, PLIN, OTHER] }
        holder: { type: string, minLength: 3, maxLength: 120 }
        number: { type: string, minLength: 3, maxLength: 80 }
        photoUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        qrUrl: { type: string, pattern: '^/uploads/[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$' }
        active: { type: boolean, default: true }
    PaymentAccount:
      allOf:
        - { $ref: '#/components/schemas/PaymentAccountInput' }
        - type: object
          properties:
            id: { type: string }
            userId: { type: string }
