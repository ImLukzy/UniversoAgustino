<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universo Agustino</title>
    <script>
      // Tema de carrera antes del primer paint (lo persiste CareerThemeProvider).
      try {
        var t = JSON.parse(localStorage.getItem("hub_theme") || "null");
        if (t) for (var k in t) if (/^--hub-p(-soft|-ink)?$/.test(k) && /^\d{1,3} \d{1,3} \d{1,3}$/.test(t[k])) document.documentElement.style.setProperty(k, t[k]);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-ua.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
    <link rel="preconnect" href="https://universo-agustino-api.onrender.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
