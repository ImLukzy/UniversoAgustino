name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping API health endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors https://universo-agustino-api.onrender.com/api/v1/health
